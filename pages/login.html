<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumbuShop.ar - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="../img/sumbu-shop.ar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/forms.css" />
    <script src="../js/theme.js" defer></script>
  </head>
  <body>
    <main>
      <div class="form__page">
        <div class="form__card">
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="form__card-icon">🍓</div>
            <h1 class="form__card-title">Iniciar sesión</h1>
            <p class="form__card-subtitle">Bienvenida de nuevo a Sumbu Shop</p>
          </div>

          <!-- Formulario DENTRO de la card -->
          <form id="loginForm">
            <div class="form__group">
              <label for="email">Correo electrónico</label>
              <input
                class="form-control"
                type="email"
                id="email"
                placeholder="tucorreo@email.com"
                required
              />
            </div>

            <div class="form__group">
              <label for="password">Contraseña</label>
              <input
                class="form-control"
                type="password"
                id="password"
                placeholder="Tu contraseña"
                required
              />
            </div>

            <button type="submit" class="btn__submit">Ingresar</button>
          </form>

          <div class="form__footer">
            ¿No tenés cuenta? <a href="register.html">Registrate acá</a>
          </div>
        </div>
      </div>
    </main>
    <!--Footer-->
    <div id="footer-container"></div>

    <!--Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/forms.js"></script>
    <script src="../js/components/footer.js"></script>
  </body>
</html>
