<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetJam.ar - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/forms.css" />
  </head>
  <body>
    <!--Formulario de inicio de sesión-->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tucorreo@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Tu contraseña"
          required
        />
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div class="form-footer">
      ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
    </div>

    <!--Footer-->
    <footer class="footer">
      <p>2026 SweetJam.ar. Todos los derechos reservados.</p>
      <p>Hecho con ❤️ en Argentina</p>
      <ul class="footer__links">
        <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </footer>

    <!--Script-->
    <script src="../js/script.js"></script>
    <script src="../js/forms.js"></script>
  </body>
</html>
