<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumbuShop.sr - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/forms.css" />
    <script src="../js/theme.js" defer></script>
  </head>
  <body>
    <main>
      <div class="form__page">
        <div class="form__card">
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="form__card-icon">🍓</div>
            <h1 class="form__card-title">Iniciar sesión</h1>
            <p class="form__card-subtitle">Bienvenida de nuevo a Sumbu Shop</p>
          </div>

          <!-- Formulario DENTRO de la card -->
          <form id="loginForm">
            <div class="form__group">
              <label for="email">Correo electrónico</label>
              <input
                class="form-control"
                type="email"
                id="email"
                placeholder="tucorreo@email.com"
                required
              />
            </div>

            <div class="form__group">
              <label for="password">Contraseña</label>
              <input
                class="form-control"
                type="password"
                id="password"
                placeholder="Tu contraseña"
                required
              />
            </div>

            <button type="submit" class="btn__submit">Ingresar</button>
          </form>

          <div class="form__footer">
            ¿No tenés cuenta? <a href="register.html">Registrate acá</a>
          </div>
        </div>
      </div>
    </main>
    <!--Footer-->
    <footer class="site__footer py-4 footer__form">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-4 mb-3 mb-md-0">
            <div class="footer__logo">🍓 Sumbu Shop</div>
            <div>Hecho con ❤️ en Argentina</div>
          </div>
          <div class="col-md-4 text-center mb-3 mb-md-0">
            <div class="d-flex justify-content-center gap-4">
              <a href="about-us.html">Sobre Nosotros</a>
              <a href="mailto:consultasDeMentiritaPorAhora@correo.com"
                >Contacto</a
              >
            </div>
          </div>
          <div class="col-md-4 text-md-end">
            © 2026 Sumbu Shop. Todos los derechos reservados.
          </div>
        </div>
      </div>
    </footer>

    <!--Script-->
    <script src="../js/navbar.js"></script>
  </body>
</html>
