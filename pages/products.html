<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumbuShop.ar - Todos los productos</title>
    <link rel="icon" type="image/png" href="../img/sumbu-shop.ar.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="../js/theme.js"></script>
  </head>

  <body>
    <!--Navbar-->
    <div id="navbar-container"></div>

    <!-- Catálogo: todos los productos (botón "Explorar productos" del index)
         o resultados de búsqueda (products.html?q=...). Lo arma renderProductsPage() en search.js -->
    <main class="page__content">
      <div class="header__search">
        <div class="container">
          <p class="section__eyebrow">Sumbu Shop</p>
          <h1 class="section__title section__title--lg" id="productsTitle">Todos los productos</h1>
          <p class="section__intro" id="productsIntro">
            Mermeladas, conservas, pastelería, papel maché y cosmética, todo en
            un solo lugar.
          </p>
        </div>
      </div>

      <!--Grilla de cards: se muestran de a tandas con el botón "Ver más"-->
      <section class="py__section bg__cream">
        <div class="container">
          <div class="row g-4" id="products-container">
            <!-- Las cards se generan con JS -->
          </div>
          <div class="text-center mt-5">
            <button type="button" id="load-more" class="btn btn__sumbu__outline">
              Ver más productos
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Contenedor del modal de producto (generado por JS) -->
    <div id="modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/components/productCard.js"></script>
    <script src="../js/components/productModal.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", renderProductsPage);
    </script>
    <script src="../js/components/footer.js"></script>
  </body>
</html>
