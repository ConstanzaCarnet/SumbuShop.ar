<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumbuShop.ar - Registrarse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/forms.css" />
  </head>
  <body>

    <!--Formulario de registro-->
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Tu nombre"
          required
        />
      </div>
               </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input
              type="text"
              id="apellido"
              name="apellido"
              placeholder="Tu apellido"
              required
            />
          </div>
        </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tucorreo@email.com"
          required
        />
      </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input
            type="date"
            id="fechaNacimiento"
            name="fechaNacimiento"
            required
            />
        </div>

      <button type="submit" class="btn-submit">Crear cuenta</button>
    </form>

    <div class="form-footer">
      ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>

    <!--Footer-->
    <footer class="footer">
      <p>2026 SumbuShop.ar. Todos los derechos reservados.</p>
      <p>Hecho con ❤️ en Argentina</p>
      <ul class="footer__links">
        <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </footer>


    <!--Script-->
    <script src="../js/script.js"></script>
    <script src="../js/forms.js"></script>
  </body>
</html>
