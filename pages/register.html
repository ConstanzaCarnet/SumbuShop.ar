<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumbuShop.ar - Registrarse</title>
    <link rel="icon" type="image/png" href="../img/sumbu-shop.ar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/forms.css" />
    <script src="../js/theme.js" defer></script>
  </head>
  <body>
    <main>
      <div class="form__page">
        <div class="form__card">
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="form__card-icon">🍓</div>
            <h1 class="form__card-title">Crear cuenta</h1>
            <p class="form__card-subtitle">Bienvenida a Sumbu Shop</p>
          </div>

          <!-- Formulario DENTRO de la card para que se vea unificado -->
          <!--Formulario de registro-->
          <form id="registerForm">
            <div class="form__group">
              <label for="nombre">Nombre</label>
              <input
                class="form-control"
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Tu nombre"
                required
              />
            </div>

            <div class="form__group">
              <label for="apellido">Apellido</label>
              <input
                class="form-control"
                type="text"
                id="apellido"
                name="apellido"
                placeholder="Tu apellido"
                required
              />
            </div>

            <div class="form__group">
              <label for="usuario">Nombre de usuario</label>
              <input
                class="form-control"
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Mínimo 4 caracteres"
                required
                minlength="4"
              />
            </div>

            <div class="form__group">
              <label for="email">Correo electrónico</label>
              <input
                class="form-control"
                type="email"
                id="email"
                name="email"
                placeholder="tucorreo@email.com"
                required
              />
            </div>

            <div class="form__group">
              <label for="password">Contraseña</label>
              <input
                class="form-control"
                type="password"
                id="password"
                name="password"
                placeholder="Mínimo 6 caracteres"
                required
                minlength="6"
              />
            </div>

            <div class="form__group">
              <label for="fechaNacimiento">Fecha de nacimiento</label>
              <input
                class="form-control"
                type="date"
                id="fechaNacimiento"
                name="fechaNacimiento"
                required
              />
            </div>

            <!--Aceptación de términos-->
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="checkDefault"
                required
              />
              <label class="form-check-label" for="checkDefault">
                Acepto los términos y condiciones y la política de privacidad
              </label>
            </div>

            <button type="submit" class="btn__submit">Crear cuenta</button>
          </form>

          <div class="form__footer">
            ¿Ya tienes una cuenta? <a href="./login.html">Inicia sesión aquí</a>
          </div>
        </div>
      </div>
    </main>

    <!--Footer-->
    <div id="footer-container"></div>

    <!--Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/forms.js"></script>
    <script src="../js/components/footer.js"></script>
  </body>
</html>
