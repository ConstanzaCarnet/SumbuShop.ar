<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SumbuShop.ar - Registrarse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/forms.css" />
  </head>
  <body>
    <!--Formulario de registro-->
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input
          type="text"
          id="apellido"
          name="apellido"
          placeholder="Tu apellido"
          required
        />
      </div>

      <div class="form-group">
        <label for="usuario">Nombre de usuario</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Con el que vas a iniciar sesión"
          required
          minlength="4"
        />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tucorreo@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Mínimo 6 caracteres"
          required
          minlength="6"
        />
      </div>

      <div class="form-group">
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input
          type="date"
          id="fechaNacimiento"
          name="fechaNacimiento"
          required
        />
      </div>

      <!--Aceptación de términos-->
      <div class="form-check">
        <input type="checkbox" id="terminos" name="terminos" required />
        <label for="terminos">
          Acepto los términos y condiciones y la política de privacidad
        </label>
      </div>

      <button type="submit" class="btn-submit">Crear cuenta</button>
    </form>

    <div class="form-footer">
      ¿Ya tienes una cuenta? <a href="./login.html">Inicia sesión aquí</a>
    </div>

    <!--Footer-->
    <footer class="site__footer py-4 footer__form">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-4 mb-3 mb-md-0">
            <div class="footer__logo">🍓 Sumbu Shop</div>
            <div>Hecho con ❤️ en Argentina</div>
          </div>
          <div class="col-md-4 text-center mb-3 mb-md-0">
            <div class="d-flex justify-content-center gap-4">
              <a href="about-us.html">Sobre Nosotros</a>
              <a href="mailto:consultasDeMentiritaPorAhora@correo.com"
                >Contacto</a
              >
            </div>
          </div>
          <div class="col-md-4 text-md-end">
            © 2026 Sumbu Shop. Todos los derechos reservados.
          </div>
        </div>
      </div>
    </footer>

    <!--Script-->
    <script src="../js/forms.js"></script>
  </body>
</html>
